<vex-secondary-toolbar current="Admin Pannel">
  <vex-breadcrumbs [crumbs]="['Dashboard', 'Company']" class="flex-auto"></vex-breadcrumbs>

  <button class="ml-2" color="primary" mat-icon-button type="button">
    <mat-icon svgIcon="mat:more_vert"></mat-icon>
  </button>
</vex-secondary-toolbar>

<div class="h-full flex flex-col">
  <div class="px-6 pt-2 pb-0 bg-foreground shadow-b flex-none border-b">
    <div class="container px-0">
      <div class="flex flex-wrap justify-between items-center gap-2">
        <!-- Left Section: Filters -->
        <div class="flex flex-wrap items-center gap-2 mt-3">
          <mat-form-field appearance="outline" class="flex-1 ltr:mr-2 rtl:ml-2" style="max-width: 250px;">
            <mat-icon matPrefix class="icon-sm" svgIcon="mat:search"></mat-icon>
            <input matInput [formControl]="searchCtrl" name="searchCtrl" placeholder="Search name..." type="text" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="flex-1 ltr:mr-2 rtl:ml-2" style="max-width: 250px;">
            <mat-label>Department</mat-label>
            <mat-select name="department" (selectionChange)="onDepartmentChange($event.value)">
              <mat-option [value]="''">None</mat-option>
              <mat-option *ngFor="let dept of allDepartments" [value]="dept">
                {{ dept.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="flex-1 ltr:mr-2 rtl:ml-2" style="max-width: 250px;">
            <mat-label>Designation</mat-label>
            <mat-select name="designation" (selectionChange)="onDesignationChange($event.value)">
              <mat-option [value]="''">None</mat-option>
              <mat-option *ngFor="let dept of designationByDept" [value]="dept.name">
                {{ dept.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Right Section: Add Employee Button -->
        <button (click)="openContact()" class="flex-none sm:inline-block mb-3" color="primary" mat-flat-button
          type="button">
          <mat-icon class="ltr:mr-2 rtl:ml-2 ltr:-ml-1 rtl:-mr-1 icon-sm" svgIcon="mat:add"></mat-icon>
          <span>Add Employee</span>
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="filteredEmployees.length !== 0" @stagger class="overflow-y-auto flex-auto">
    <div class="p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6 container">
      <vex-employee-card *ngFor="let contact of filteredEmployees; trackBy: trackById" @fadeInUp
        [contact]="contact"></vex-employee-card>
    </div>
  </div>

  <div *ngIf="filteredEmployees.length == 0" @scaleFadeIn class="flex-auto flex flex-col items-center justify-center">
    <img class="m-12 h-64" src="assets/img/illustrations/idea.svg" />
    <h2 class="headline m-0 text-center">No employees matching your filters</h2>
  </div>
</div>
