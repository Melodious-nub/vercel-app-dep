<vex-secondary-toolbar current="Admin Pannel">
    <vex-breadcrumbs [crumbs]="['Dashboard', 'Training']" class="flex-auto"></vex-breadcrumbs>

    <button class="ml-2" color="primary" mat-icon-button type="button">
        <mat-icon svgIcon="mat:more_vert"></mat-icon>
    </button>
</vex-secondary-toolbar>

<div class="p-6 container">
    <div @fadeInUp class="card p-16" style="padding-top: 30px;">
        <vex-training-form [selectedEmployeeName]="selectedEmployeeName"
            [isGlobalTraining]="isGlobalTraining"></vex-training-form>
    </div>
</div>
